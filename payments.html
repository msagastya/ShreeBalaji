<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — Shree Balaji Tempo Services</title>
<script src="assets/js/security-utils.js"></script>
<script src="assets/js/data-cache.js"></script>
<script src="assets/js/ui-loader.js"></script>
<link rel="stylesheet" href="assets/css/mobile.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#eef3f6;color:#17212b;font-size:14px}.logged-out .app{display:none}.logged-in .login-screen{display:none}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:min(340px,100%);background:#fff;border:1px solid #c6d1da;padding:22px;box-shadow:0 18px 42px rgba(15,23,42,.14)}
.login-box h1{font-size:22px;margin-bottom:14px}.login-box label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}.login-box input{width:100%;border:1px solid #b8c4cc;padding:9px;font-size:15px}.login-box button{width:100%;margin-top:14px;padding:10px;border:0;background:#102433;color:#fff;font-weight:bold;cursor:pointer}.login-error{color:#b71c1c;font-size:12px;margin-top:8px;min-height:16px}
.topbar{background:#102433;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 8px 24px rgba(15,23,42,.18)}.brand{font-weight:bold;letter-spacing:.8px;margin-right:8px}.topbar a{color:#fff;text-decoration:none;font-size:12.5px;font-weight:bold;background:rgba(255,255,255,.1);padding:7px 11px;border-radius:4px}.topbar a.active{background:#d6b767;color:#102433}.status{margin-left:auto;color:#dce7ef;font-size:12.5px}.logout{border:0;background:#263d4d;color:#fff;padding:7px 11px;border-radius:4px;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 40px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#fff;border:1px solid #c6d1da;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.06);overflow-x:auto}h1{font-size:25px;color:#102433;margin-bottom:6px}.sub{color:#596b78;margin-bottom:18px}.field{margin-bottom:12px}.field label{display:block;font-size:11.5px;font-weight:bold;color:#526371;text-transform:uppercase;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #b8c4cc;padding:10px;font-size:15px}.value{background:#eef5f8;border:1px solid #c6d1da;padding:12px;font-weight:bold;font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{border:0;padding:10px;font-weight:bold;cursor:pointer;border-radius:4px}.primary{background:#16738a;color:#fff}.secondary{background:#102433;color:#fff}.clear{background:#b3261e;color:#fff}.full{grid-column:1/-1}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-weight:bold;font-size:12px}.paid{background:#e7f6ec;color:#176b35}.due{background:#fff1e6;color:#9a4b00}
table{width:100%;border-collapse:collapse}th{background:#223542;color:#fff;text-align:left;padding:9px;font-size:12px}td{border:1px solid #d8e1e7;padding:9px;font-size:13px}tr:nth-child(even) td{background:#f7fafc}.amt{text-align:right;font-weight:bold}.search{margin-bottom:12px;display:flex;gap:10px}.search input{flex:1;border:1px solid #b8c4cc;padding:10px}.search select{border:1px solid #b8c4cc;padding:10px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.status{margin-left:0;width:100%}}@media(max-width:560px){.topbar{display:grid;grid-template-columns:1fr 1fr}.brand,.status,.logout{grid-column:1/-1}.topbar a,.logout{text-align:center}.actions{grid-template-columns:1fr}table{min-width:680px}.search{display:grid}}
</style>
</head>
<body class="logged-out">
<div class="login-screen"><form class="login-box" onsubmit="login(event)"><h1>SHREE BALAJI</h1><label>USERNAME</label><input id="login-user" value="ShreeBalaji"><label>PASSWORD</label><input id="login-pass" type="password" value="ShreeBalaji"><button>LOGIN</button><div class="login-error" id="login-error"></div></form></div>
<main class="app">
<nav class="topbar"><div class="brand">SHREE BALAJI</div><a href="dashboard.html">DASHBOARD</a><a href="index.html">PREVIEW</a><a href="invoice-entry.html">ENTRY</a><a href="master.html">PARTIES</a><a class="active" href="payments.html">PAYMENTS</a><a href="report.html">REPORTS</a><a href="hermes.html">HERMES</a><div class="status" id="db-status">Ready</div><button class="logout" onclick="logout()">LOGOUT</button></nav>
<div class="wrap"><h1>Payment Register</h1><p class="sub">Load an invoice, record received amount, save, and monitor outstanding balance.</p>
<div class="grid">
<section class="panel">
  <div class="field"><label>Invoice No.</label><input id="pay-inv-no" placeholder="INV/2627/001"></div>
  <div class="field"><label>Party</label><div class="value" id="party-name">-</div></div>
  <div class="field"><label>Total Amount</label><div class="value" id="pay-total">₹ 0</div></div>
  <div class="field"><label>Received Amount</label><input id="pay-received" type="number" min="0" step="0.01" value="0" oninput="updatePaymentPreview()"></div>
  <div class="field"><label>Balance Due</label><div class="value" id="pay-balance">₹ 0</div></div>
  <span class="pill due" id="pay-status">Balance Due</span>
  <div class="actions"><button class="primary" onclick="loadPaymentInvoice()">Load</button><button class="secondary" onclick="markPaymentDone()">Full Paid</button><button class="primary full" onclick="savePaymentEntry()">Save Payment</button><button class="secondary full" onclick="printReceipt()">Print Receipt</button><button class="clear full" onclick="clearPaymentEntry()">Clear</button></div>
</section>
<section class="panel"><div class="search"><input id="search" placeholder="Search invoice or party..." oninput="renderRows()"><select id="filter" onchange="renderRows()"><option value="">All</option><option value="due">Due Only</option><option value="paid">Paid Only</option></select><button class="secondary" onclick="exportPaymentCsv()">Export CSV</button></div><table><thead><tr><th>Invoice</th><th>Party</th><th class="amt">Total</th><th class="amt">Received</th><th class="amt">Due</th><th>Status</th></tr></thead><tbody id="payment-body"><tr><td colspan="6">Loading...</td></tr></tbody></table></section>
</div></div>
</main>
<script>
const API_URL='https://hhtwjimbtppatyxtjemz.supabase.co/functions/v1/shreebalaji-api';let currentInvoice=null;let rows=[];let hydrateRun=0;
function getAuth(){return{username:sessionStorage.getItem('sb_user')||'',password:sessionStorage.getItem('sb_pass')||''}}function fmt(n){return Math.round(n||0).toLocaleString('en-IN')}function parseMoney(v){return parseFloat(String(v||'').replace(/[^0-9.-]/g,''))||0}
function applyLoginState(){const a=getAuth();const ok=!!a.username&&!!a.password;document.body.className=ok?'logged-in':'logged-out';if(ok)loadRows()}async function login(e){e.preventDefault();const u=document.getElementById('login-user').value.trim();const p=document.getElementById('login-pass').value;try{await api('login',{username:u,password:p});sessionStorage.setItem('sb_user',u);sessionStorage.setItem('sb_pass',p);applyLoginState()}catch(error){document.getElementById('login-error').textContent=error.message||'Invalid username or password'}}function logout(){sessionStorage.removeItem('sb_user');sessionStorage.removeItem('sb_pass');applyLoginState()}
async function api(action,payload={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...getAuth(),...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function totals(data){let taxable=0;(data.items||[]).forEach(it=>{let amt=parseMoney(it.amt);if(!amt&&it.qty&&it.rate)amt=parseMoney(it.qty)*parseMoney(it.rate);taxable+=amt});const rate=parseMoney(data.invoice?.gstRate||18);const total=Math.round(taxable+(taxable*rate/100));const received=parseMoney(data.invoice?.receivedAmount||data.payment?.receivedAmount);return{total,received,due:Math.max(total-received,0)}}
async function loadRows(){hydrateRun++;SBUI.setBusy(true,'Loading payment ledger...');try{const list=await SBDataCache.paymentLedger(api);rows=(list.rows||[]).map(row=>({no:row.invoice_no,party:row.party_name||'',date:row.invoice_date||'',data:null,total:row.total||0,received:row.received||0,due:row.due||0,loaded:true,loading:false}));renderRows();SBUI.setBusy(false,`Ready • ₹ ${fmt(list.grand?.due||0)} due`)}catch(e){console.error(e);SBUI.setBusy(false,'Error');document.getElementById('payment-body').innerHTML='<tr><td colspan="6">Could not load payments.</td></tr>'}}
function renderRows(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;const body=document.getElementById('payment-body');body.innerHTML='';rows.filter(r=>(!q||r.no.toLowerCase().includes(q)||r.party.toLowerCase().includes(q))&&(!f||!r.loaded||(f==='due'?r.due>0:r.due<=0))).forEach(r=>{const tr=document.createElement('tr');tr.onclick=()=>{document.getElementById('pay-inv-no').value=r.no;loadPaymentInvoice()};tr.innerHTML=`<td>${escapeHtml(r.no)}</td><td>${escapeHtml(r.party)}</td><td class="amt">${r.loaded?'₹ '+fmt(r.total):'<span class="skeleton">Loading total</span>'}</td><td class="amt">${r.loaded?'₹ '+fmt(r.received):'<span class="skeleton">Loading</span>'}</td><td class="amt">${r.loaded?'₹ '+fmt(r.due):'<span class="skeleton">Loading</span>'}</td><td>${r.loaded?`<span class="pill ${r.due>0?'due':'paid'}">${r.due>0?'Due':'Paid'}</span>`:(r.loading?'Calculating...':'Queued')}</td>`;body.appendChild(tr)});if(!body.children.length)body.innerHTML='<tr><td colspan="6">No matching invoices.</td></tr>'}
async function hydratePaymentRows(run){let done=0;for(const row of rows){if(run!==hydrateRun)return;if(row.loaded)continue;row.loading=true;renderRows();try{const full=await SBDataCache.loadInvoice(api,row.no);const data=full.data||{};const t=totals(data);Object.assign(row,{party:data.billTo?.name||row.party,data,...t,loaded:true,loading:false})}catch(e){console.error(e);row.loading=false}done++;renderRows();SBUI.setBusy(true,`Payments ${done}/${rows.length}`);await new Promise(r=>setTimeout(r,20))}SBUI.setBusy(false,'Ready')}
async function loadPaymentInvoice(){const invoiceNo=document.getElementById('pay-inv-no').value.trim();if(!invoiceNo)return alert('Enter invoice number.');SBUI.setBusy(true,'Loading invoice...');const full=await SBDataCache.loadInvoice(api,invoiceNo);if(!full.data){SBUI.setBusy(false,'Not found');return alert('Invoice not found.')}currentInvoice=full.data;const t=totals(currentInvoice);document.getElementById('party-name').textContent=currentInvoice.billTo?.name||'-';document.getElementById('pay-received').value=t.received.toFixed(2);const row=rows.find(r=>r.no===invoiceNo);if(row)Object.assign(row,{party:currentInvoice.billTo?.name||row.party,data:currentInvoice,...t,loaded:true,loading:false});renderRows();updatePaymentPreview();SBUI.setBusy(false,'Invoice loaded')}
function updatePaymentPreview(){const t=currentInvoice?totals(currentInvoice):{total:0};const received=parseMoney(document.getElementById('pay-received').value);const due=Math.max(t.total-received,0);document.getElementById('pay-total').textContent='₹ '+fmt(t.total);document.getElementById('pay-balance').textContent='₹ '+fmt(due);const s=document.getElementById('pay-status');s.textContent=due<=0&&t.total>0?'Paid':'Balance Due';s.className='pill '+(due<=0&&t.total>0?'paid':'due')}
function markPaymentDone(){if(!currentInvoice)return alert('Load invoice first.');document.getElementById('pay-received').value=totals(currentInvoice).total.toFixed(2);updatePaymentPreview()}
async function savePaymentEntry(){if(!currentInvoice)return alert('Load invoice first.');const invoiceNo=document.getElementById('pay-inv-no').value.trim();currentInvoice.invoice=currentInvoice.invoice||{};currentInvoice.invoice.receivedAmount=parseMoney(document.getElementById('pay-received').value).toFixed(2);const t=totals(currentInvoice);currentInvoice.payment={totalAmount:t.total,receivedAmount:t.received,balanceAmount:t.due,status:t.due<=0?'PAID':'BALANCE_DUE',updatedAt:new Date().toISOString()};document.getElementById('db-status').textContent='Saving...';await api('saveInvoice',{data:currentInvoice});SBDataCache.invalidateInvoice(invoiceNo);document.getElementById('db-status').textContent='Saved';await loadRows();document.getElementById('pay-inv-no').value=invoiceNo}
function clearPaymentEntry(){currentInvoice=null;document.getElementById('pay-inv-no').value='';document.getElementById('party-name').textContent='-';document.getElementById('pay-received').value='0';updatePaymentPreview()}
function exportPaymentCsv(){const lines=[['Invoice','Party','Total','Received','Due','Status'].map(csvCell).join(',')];rows.forEach(row=>lines.push([row.no,row.party,row.total,row.received,row.due,row.due>0?'Due':'Paid'].map(csvCell).join(',')));downloadTextFile(`shree-balaji-payments-${new Date().toISOString().slice(0,10)}.csv`,lines.join('\n'),'text/csv')}
function printReceipt(){if(!currentInvoice)return alert('Load invoice first.');const invoiceNo=document.getElementById('pay-inv-no').value.trim();const party=currentInvoice.billTo?.name||'-';const total=document.getElementById('pay-total').textContent;const received='₹ '+fmt(parseMoney(document.getElementById('pay-received').value));const balance=document.getElementById('pay-balance').textContent;const html=`<html><head><title>Payment Receipt ${invoiceNo}</title><style>body{font-family:Arial;padding:28px;color:#111}.box{border:1px solid #222;padding:24px;max-width:720px;margin:auto}h1{font-size:22px;margin:0 0 6px}.muted{color:#555;margin-bottom:24px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}.amt{font-weight:bold}.sign{margin-top:60px;text-align:right}@media print{body{padding:0}.box{border:0}}</style></head><body><div class="box"><h1>SHREE BALAJI TEMPO SERVICES</h1><div class="muted">Payment Receipt</div><div class="row"><span>Invoice No.</span><b>${escapeHtml(invoiceNo)}</b></div><div class="row"><span>Party</span><b>${escapeHtml(party)}</b></div><div class="row"><span>Total Amount</span><b class="amt">${escapeHtml(total)}</b></div><div class="row"><span>Received Amount</span><b class="amt">${escapeHtml(received)}</b></div><div class="row"><span>Balance Due</span><b class="amt">${escapeHtml(balance)}</b></div><div class="sign">Authorized Signatory</div></div><script>print();<\/script></body></html>`;const win=window.open('','_blank');win.document.write(html);win.document.close()}
applyLoginState();
</script>
</body>
</html>
